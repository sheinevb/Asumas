<style>/* =====================================================================
   ASUMAS — Design tokens
   Linguagem adaptada do design system LN4 (lando norris):
   escala fluida, Mona Sans + serifa de acento, verde profundo + lima,
   molduras entalhadas, linhas topográficas e revelação por linha.
   ===================================================================== */
:root {
  /* Paleta — papéis semânticos (60 superfície clara · 30 verde profundo · 10 lima) */
  --c-forest: #17251a;      /* bg-dark: seções escuras, rodapé */
  --c-ink: #0e1410;         /* bg-deep: vitrine de programas */
  --c-paper: #f6f6ef;       /* bg-canvas: hero e páginas */
  --c-bone: #ecece2;        /* bg-surface: seções claras alternadas */
  --c-white: #fbfbf7;       /* bg-raised: campos, cards claros */
  --c-leaf: #3a8b3e;        /* verde do mapa (marca) — gráficos e textos grandes */
  --c-pine: #2a6130;        /* verde da palavra ASUMAS — acento de texto em claro */
  --c-lime: #c8f03c;        /* accent-primary: ação principal */
  --c-lime-off: #a8c94b;    /* acento serifado em fundo escuro */
  --c-mist: #dde3d2;        /* texto principal em escuro */
  --c-sage: #b3bba6;        /* texto secundário em escuro */
  --c-slate: #545a50;       /* texto secundário em claro */
  --c-line-dark: rgba(221, 227, 210, .22);
  --c-line-light: rgba(23, 37, 26, .16);
  --c-topo: #233526;        /* linhas topográficas sobre forest */
  --c-error: #b3261e;
  --c-error-dark: #ff9b8f;

  /* Tipografia */
  --f-sans: "Mona Sans", "Hubot Sans", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-serif: "Fraunces", "Georgia", "Times New Roman", serif;
  --f-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  /* Escala modular Perfect Fourth (1.333) */
  --fs-xs: .75rem;      /* 12 */
  --fs-sm: .875rem;     /* 14 */
  --fs-base: 1rem;      /* 16 */
  --fs-md: 1.333rem;    /* 21 */
  --fs-lg: 1.777rem;    /* 28 */
  --fs-xl: 2.369rem;    /* 38 */
  --fs-2xl: 3.157rem;   /* 51 */
  --fs-3xl: 4.209rem;   /* 67 */
  --fs-4xl: 5.61rem;    /* 90 */
  --fs-5xl: 7.48rem;    /* 120 */

  /* Espaçamento 8pt */
  --s1: .5rem; --s2: 1rem; --s3: 1.5rem; --s4: 2rem; --s5: 3rem;
  --s6: 4rem; --s7: 6rem; --s8: 8rem; --s9: 10rem;
  --pad: 1.25rem;
  --gutter: 1rem;
  --section: var(--s6);

  /* Geometria */
  --r-ctl: .5rem;       /* botões, campos (LN4: 7.2px) */
  --r-card: .5rem;      /* molduras entalhadas */
  --r-media: 2.5rem;    /* mídia arredondada (LN4: 44px) */

  /* Movimento (LN4) */
  --ease: cubic-bezier(0.65, 0.05, 0, 1);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: .75s;

  --util-h: 2.25rem;
  --nav-h: 4.5rem;
}

/* Escala fluida — mesma lógica do LN4: o rem cresce com a largura útil */
html { font-size: 16px; }
@media (min-width: 992px) {
  :root { --pad: 2rem; --gutter: 1.25rem; --section: var(--s8); --nav-h: 5rem; }
  html { font-size: calc(clamp(992px, 100vw, 1920px) / 1440 * 16); }
}

/* ===================================================================== Base */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--nav-h) + 1rem); }
body {
  font-family: var(--f-sans);
  font-size: var(--fs-base);
  line-height: 1.55;
  color: var(--c-forest);
  background: var(--c-paper);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-variation-settings: "wdth" 100;
  text-rendering: optimizeLegibility;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
ul, ol { list-style: none; }
::selection { background: var(--c-lime); color: var(--c-forest); }

:focus-visible {
  outline: 2px solid var(--c-lime);
  outline-offset: 3px;
  border-radius: 4px;
  box-shadow: 0 0 0 5px rgba(23, 37, 26, .9);
}
.theme-light :focus-visible, [data-theme="light"] :focus-visible { box-shadow: 0 0 0 5px var(--c-forest); }

.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.skip { position: fixed; left: 1rem; top: -4rem; z-index: 999; background: var(--c-lime); color: var(--c-forest); padding: .75rem 1rem; border-radius: var(--r-ctl); font-weight: 700; transition: top .2s; }
.skip:focus { top: 1rem; }

/* Marcador de dado pendente (handoff para o cliente) */
.todo {
  display: inline-flex; align-items: center; gap: .35em;
  font-family: var(--f-mono); font-size: .72em; font-weight: 500; letter-spacing: 0;
  text-transform: none; line-height: 1.3;
  padding: .15em .5em; border: 1px dashed currentColor; border-radius: 4px; opacity: .75;
  vertical-align: middle; white-space: nowrap;
}

/* ===================================================================== Layout */
.c { width: 100%; padding-inline: var(--pad); margin-inline: auto; max-width: 120rem; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gutter); }
@media (min-width: 768px) { .grid { grid-template-columns: repeat(12, minmax(0, 1fr)); } }
.sec { position: relative; padding-block: var(--section); overflow: clip; }
.sec.tight { padding-block: calc(var(--section) * .6); }
.sec + .sec.same { padding-top: 0; }

[data-theme="dark"] { background: var(--c-forest); color: var(--c-mist); }
[data-theme="deep"] { background: var(--c-ink); color: var(--c-paper); }
[data-theme="light"] { background: var(--c-paper); color: var(--c-forest); }
[data-theme="bone"] { background: var(--c-bone); color: var(--c-forest); }
[data-theme="lime"] { background: var(--c-lime); color: var(--c-forest); }

.muted { color: var(--c-slate); }
[data-theme="dark"] .muted, [data-theme="deep"] .muted { color: var(--c-sage); }

/* Linhas topográficas (equivalente às linhas WebGL do LN4) */
.topo { position: absolute; inset: 0; pointer-events: none; color: var(--c-topo); opacity: 1; z-index: 0; }
.topo svg { width: 100%; height: 100%; }
.topo svg g { stroke: currentColor; }
[data-theme="deep"] .topo { color: #18221a; }
[data-theme="light"] .topo, [data-theme="bone"] .topo { color: rgba(42, 97, 48, .09); }
.sec > .c { position: relative; z-index: 1; }

/* ===================================================================== Tipografia */
.eyebrow {
  font-size: var(--fs-xs);
  font-weight: 800;
  font-variation-settings: "wdth" 82;
  font-stretch: 82%;
  text-transform: uppercase;
  letter-spacing: .08em;
  line-height: 1.2;
  display: inline-flex; align-items: center; gap: .6em;
}
.eyebrow.lg { font-size: var(--fs-sm); }
.eyebrow .dot { width: .5em; height: .5em; border-radius: 50%; background: var(--c-lime); flex: none; }
[data-theme="light"] .eyebrow .dot, [data-theme="bone"] .eyebrow .dot { background: var(--c-leaf); }

.display, .impact, .title-l, .title-m {
  font-weight: 760;
  font-variation-settings: "wdth" 108;
  font-stretch: 108%;
  text-transform: uppercase;
  letter-spacing: -.01em;
  line-height: .92;
  text-wrap: balance;
}
.display { font-size: clamp(2.75rem, 11vw, 3.5rem); }
.impact { font-size: clamp(2.25rem, 9vw, var(--fs-2xl)); }
.title-l { font-size: clamp(2rem, 8vw, var(--fs-xl)); }
.title-m { font-size: var(--fs-lg); line-height: 1; }
@media (min-width: 992px) {
  .display { font-size: var(--fs-5xl); }
  .impact { font-size: var(--fs-4xl); }
  .title-l { font-size: var(--fs-2xl); }
  .title-m { font-size: var(--fs-xl); }
}
/* Acento serifado (papel do Brier no LN4) */
.serif {
  font-family: var(--f-serif);
  font-weight: 700;
  font-style: italic;
  text-transform: none;
  letter-spacing: -.02em;
  font-variation-settings: "opsz" 144, "SOFT" 30, "WONK" 1;
  font-stretch: 100%;
}
.acc { color: var(--c-pine); }
[data-theme="dark"] .acc, [data-theme="deep"] .acc { color: var(--c-lime-off); }

.statement {
  font-size: clamp(1.75rem, 6.6vw, var(--fs-xl));
  font-weight: 640;
  font-variation-settings: "wdth" 100;
  line-height: 1.08;
  letter-spacing: -.015em;
  text-wrap: balance;
}
@media (min-width: 992px) { .statement { font-size: var(--fs-3xl); line-height: 1.02; } }
.statement strong { font-weight: 800; color: var(--c-paper); }
[data-theme="light"] .statement strong, [data-theme="bone"] .statement strong { color: var(--c-forest); }

.lead {
  font-family: var(--f-serif);
  font-size: var(--fs-md);
  font-weight: 400;
  line-height: 1.35;
  font-variation-settings: "opsz" 36;
  max-width: 34ch;
  text-wrap: pretty;
}
@media (min-width: 992px) { .lead { font-size: var(--fs-lg); } }
.body { font-size: var(--fs-base); line-height: 1.6; max-width: 62ch; text-wrap: pretty; }
.body-sm { font-size: var(--fs-sm); line-height: 1.55; }
.label { font-size: var(--fs-sm); font-weight: 650; line-height: 1.3; }
.num {
  font-weight: 780;
  font-variation-settings: "wdth" 112;
  font-stretch: 112%;
  letter-spacing: -.02em;
  line-height: .9;
  font-feature-settings: "tnum" 1;
}

.prose { max-width: 68ch; }
.prose > * + * { margin-top: 1.1em; }
.prose h2 { font-size: var(--fs-lg); font-weight: 760; line-height: 1.1; margin-top: 1.8em; font-variation-settings: "wdth" 100; }
.prose h3 { font-size: var(--fs-md); font-weight: 700; margin-top: 1.5em; }
.prose p, .prose li { font-size: 1.0625rem; line-height: 1.7; }
.prose ul { padding-left: 1.2em; list-style: disc; }
.prose ul li + li { margin-top: .4em; }
.prose a { text-decoration: underline; text-underline-offset: .2em; text-decoration-color: var(--c-leaf); }
.prose blockquote { border-left: 3px solid var(--c-lime); padding-left: 1.25rem; font-family: var(--f-serif); font-size: var(--fs-md); line-height: 1.4; }
.prose blockquote cite { display: block; margin-top: .5rem; font-family: var(--f-sans); font-size: var(--fs-sm); font-style: normal; color: var(--c-slate); }

/* ===================================================================== Botões (LN4 .btn-w) */
.btn {
  --bh: 2.75rem;
  position: relative;
  display: inline-flex; align-items: center; gap: .75rem;
  min-height: var(--bh);
  padding: 0 .5rem 0 1rem;
  border-radius: var(--r-ctl);
  border: 1px solid currentColor;
  font-size: var(--fs-sm);
  font-weight: 800;
  font-variation-settings: "wdth" 86;
  font-stretch: 86%;
  text-transform: uppercase;
  letter-spacing: .04em;
  line-height: 1;
  white-space: nowrap;
  transition: background-color .3s, color .3s, border-color .3s, opacity .3s;
}
.btn.lg { --bh: 3.25rem; font-size: var(--fs-base); padding-left: 1.25rem; }
.btn .ico { width: 1.75rem; height: 1.75rem; display: grid; place-items: center; border-radius: calc(var(--r-ctl) - 2px); overflow: hidden; flex: none; }
.btn.lg .ico { width: 2.125rem; height: 2.125rem; }
.btn-primary { background: var(--c-lime); border-color: var(--c-lime); color: var(--c-forest); }
.btn-primary .ico { background: var(--c-forest); color: var(--c-lime); }
.btn-primary:hover { background: #d6f765; }
.btn-ghost { background: transparent; }
.btn-ghost .ico { background: currentColor; }
.btn-ghost .ico svg { color: var(--ghost-ink, var(--c-paper)); }
[data-theme="dark"], [data-theme="deep"], .cta-panel, .callout-dl, .ouv { --ghost-ink: var(--c-forest); }
[data-theme="light"], [data-theme="bone"], [data-theme="lime"] { --ghost-ink: var(--c-paper); }
[data-theme="lime"] .btn-ghost .ico svg { color: var(--c-lime); }
.btn-ghost:hover { background: rgba(127,127,127,.08); }
.btn-wa { background: transparent; }
.btn[aria-disabled="true"], .btn:disabled { opacity: .4; pointer-events: none; cursor: not-allowed; }
.btn.is-loading { pointer-events: none; }
.btn.is-loading .roll { opacity: .5; }
.btn.is-loading .ico svg { animation: spin 1s linear infinite; }
.btn.icon-only { padding: 0; width: var(--bh); justify-content: center; }
.btn.icon-only .ico { width: 100%; height: 100%; background: transparent; color: inherit; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Text roll — caracteres sobem e a cópia via text-shadow assume (LN4) */
.roll { display: inline-block; overflow: hidden; line-height: 1.2; padding-block: .05em; --off: 1.25em; }
.roll .ch { display: inline-block; text-shadow: 0 var(--off) 0 currentColor; transition: transform .6s var(--ease-out); transition-delay: calc(var(--i) * 18ms); white-space: pre; }
a:hover .roll .ch, button:hover .roll .ch, a:focus-visible .roll .ch { transform: translateY(calc(var(--off) * -1)); }

/* Seta — sai e entra (papel da Rive btn-ui/arrow) */
.arr { position: relative; width: 1rem; height: 1rem; overflow: hidden; }
.arr svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform .55s var(--ease); }
.arr svg + svg { transform: translate(-130%, 130%); }
.arr.ne svg + svg { transform: translate(-130%, 130%); }
.arr.e svg + svg { transform: translateX(-130%); }
a:hover .arr.ne svg:first-child, button:hover .arr.ne svg:first-child { transform: translate(130%, -130%); }
a:hover .arr.e svg:first-child, button:hover .arr.e svg:first-child { transform: translateX(130%); }
a:hover .arr svg + svg, button:hover .arr svg + svg { transform: none; }

/* Link de texto (LN4 .text-link-w) */
.tlink {
  display: inline-flex; align-items: center; gap: .5rem;
  font-size: var(--fs-sm); font-weight: 800;
  font-variation-settings: "wdth" 86; font-stretch: 86%;
  text-transform: uppercase; letter-spacing: .04em; line-height: 1.2;
  padding-block: .35rem;
  border-bottom: 1px solid currentColor;
}
.tlink.lg { font-size: var(--fs-md); border-bottom-width: 2px; }
.tlink.plain { border-bottom: 0; }
.tlink.lime { color: var(--c-lime); }

/* ===================================================================== Barra utilitária */
.util {
  position: relative; z-index: 60;
  height: var(--util-h);
  background: var(--c-ink); color: var(--c-sage);
  font-size: var(--fs-xs);
}
.util .c { display: flex; align-items: center; justify-content: space-between; height: 100%; gap: 1rem; }
.util a { display: inline-flex; align-items: center; gap: .4rem; font-weight: 700; letter-spacing: .02em; transition: color .2s; }
.util a:hover { color: var(--c-lime); }
.util .left, .util .right { display: flex; align-items: center; gap: 1.25rem; }
.util .plvc { color: var(--c-lime); }
.util .social { display: flex; gap: .25rem; }
.util .social a { width: 1.75rem; height: 1.75rem; justify-content: center; border-radius: 4px; }
.util .social svg { width: .95rem; height: .95rem; }
.util .hide-sm { display: none; }
@media (min-width: 640px) { .util .hide-sm { display: inline-flex; } }

/* ===================================================================== Header / navegação */
.nav {
  position: sticky; top: 0; z-index: 50;
  height: var(--nav-h);
  color: var(--c-forest);
  transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease), box-shadow .4s;
}
.nav::before { content: ""; position: absolute; inset: 0; background: var(--c-paper); opacity: .94; transition: background-color var(--dur) var(--ease); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.nav.is-dark { color: var(--c-paper); }
.nav.is-dark::before { background: var(--c-forest); }
.nav.is-scrolled { box-shadow: 0 1px 0 var(--c-line-light); }
.nav.is-dark.is-scrolled { box-shadow: 0 1px 0 var(--c-line-dark); }
.nav .c { position: relative; height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; }
.brand { position: relative; display: block; width: 8.5rem; height: 2.5rem; flex: none; }
@media (min-width: 992px) { .brand { width: 10.5rem; height: 3.06rem; } }
.brand img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: left center; transition: opacity var(--dur) var(--ease); }
.brand .on-dark { opacity: 0; }
.nav.is-dark .brand .on-dark, .nav.menu-open .brand .on-dark { opacity: 1; }
.nav.is-dark .brand .on-light, .nav.menu-open .brand .on-light { opacity: 0; }

.menu { display: none; }
@media (min-width: 1100px) {
  .menu { display: flex; gap: 1.6rem; align-items: center; }
  .menu a {
    position: relative; font-size: var(--fs-sm); font-weight: 800;
    font-variation-settings: "wdth" 86; font-stretch: 86%;
    text-transform: uppercase; letter-spacing: .05em; padding-block: .5rem;
  }
  .menu a::after { content: ""; position: absolute; left: 0; right: 0; bottom: .15rem; height: 2px; background: currentColor; transform: scaleX(0); transform-origin: right; transition: transform .5s var(--ease); }
  .menu a:hover::after, .menu a[aria-current="page"]::after { transform: scaleX(1); transform-origin: left; }
  .menu a[aria-current="page"]::after { background: var(--c-leaf); }
  .nav.is-dark .menu a[aria-current="page"]::after { background: var(--c-lime); }
}
.nav-actions { display: flex; align-items: center; gap: .5rem; }
.nav-actions .btn-primary { display: none; }
@media (min-width: 560px) { .nav-actions .btn-primary { display: inline-flex; } }
.ham {
  width: 2.75rem; height: 2.75rem; border-radius: .62rem; border: 1px solid currentColor;
  display: grid; place-items: center; position: relative;
}
.ham span { position: absolute; left: 50%; width: 1.1rem; height: 2px; background: currentColor; transform: translateX(-50%); transition: transform .45s var(--ease), top .45s var(--ease), opacity .2s; }
.ham span:nth-child(1) { top: calc(50% - 4px); }
.ham span:nth-child(2) { top: calc(50% + 3px); }
.ham[aria-expanded="true"] span:nth-child(1) { top: calc(50% - 1px); transform: translateX(-50%) rotate(45deg); }
.ham[aria-expanded="true"] span:nth-child(2) { top: calc(50% - 1px); transform: translateX(-50%) rotate(-45deg); }
@media (min-width: 1100px) { .ham { display: none; } }

/* Menu em tela cheia (mobile/tablet) */
.drawer {
  position: fixed; inset: 0; z-index: 45;
  background: var(--c-forest); color: var(--c-paper);
  padding: calc(var(--util-h) + var(--nav-h) + 1.5rem) var(--pad) 2rem;
  display: flex; flex-direction: column; justify-content: space-between; gap: 2rem;
  clip-path: inset(0 0 100% 0);
  transition: clip-path .7s var(--ease), visibility 0s .7s;
  visibility: hidden; overflow-y: auto;
}
.drawer.open { clip-path: inset(0 0 0 0); visibility: visible; transition: clip-path .7s var(--ease); }
.drawer nav a {
  display: block; font-size: clamp(2rem, 9vw, 3rem); font-weight: 780;
  font-variation-settings: "wdth" 100; text-transform: uppercase; line-height: 1.08; padding-block: .2rem;
}
.drawer nav a[aria-current="page"] { color: var(--c-lime); }
.drawer .foot { display: grid; gap: 1rem; }
.nav.menu-open { color: var(--c-paper); }
.nav.menu-open::before { background: transparent; }

/* ===================================================================== Cabeçalho de página */
.ph-head { position: relative; padding-top: var(--s6); padding-bottom: var(--s6); overflow: clip; }
@media (min-width: 992px) { .ph-head { padding-top: var(--s7); padding-bottom: var(--s7); } }
.crumbs { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; font-size: var(--fs-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: var(--s4); }
.crumbs a { opacity: .7; transition: opacity .2s; }
.crumbs a:hover { opacity: 1; text-decoration: underline; text-underline-offset: .2em; }
.crumbs .sep { opacity: .4; }
.ph-head .grid { align-items: end; row-gap: var(--s4); }
.ph-head h1 { grid-column: 1 / -1; }
.ph-head .intro { grid-column: 1 / -1; }
@media (min-width: 768px) {
  .ph-head h1 { grid-column: 1 / span 8; }
  .ph-head .intro { grid-column: 9 / span 4; }
}

/* ===================================================================== Título de seção (LN4 .title-layout) */
.sec-title { row-gap: var(--s3); margin-bottom: var(--s6); align-items: end; }
.sec-title .t { grid-column: 1 / -1; }
.sec-title .p { grid-column: 1 / -1; }
.sec-title .a { grid-column: 1 / -1; }
@media (min-width: 768px) {
  .sec-title .t { grid-column: 1 / span 7; }
  .sec-title .p { grid-column: 8 / span 4; }
  .sec-title .a { grid-column: 8 / span 5; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
  .sec-title .p + .a { grid-column: 8 / span 5; }
}
.sec-title .t .eyebrow { margin-bottom: var(--s3); }

/* ===================================================================== Moldura entalhada (LN4 helmet frame) */
.notch { position: relative; isolation: isolate; }
.notch > .frame { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: visible; }
.notch > .frame path { fill: none; vector-effect: non-scaling-stroke; transition: opacity var(--dur) var(--ease); }
.notch > .frame .base { stroke: var(--frame, rgba(221,227,210,.28)); stroke-width: 1.5; }
.notch > .frame .over { stroke: var(--c-lime); stroke-width: 2; opacity: 0; }
.notch:hover > .frame .over, .notch:focus-within > .frame .over { opacity: 1; }
[data-theme="light"] .notch, [data-theme="bone"] .notch { --frame: rgba(23,37,26,.25); }
[data-theme="light"] .notch > .frame .over, [data-theme="bone"] .notch > .frame .over { stroke: var(--c-leaf); }
.notch-fill { position: absolute; inset: 0; z-index: 0; }

/* Imagem padrão da marca / espaço de foto */
.media {
  position: relative; overflow: hidden; background: var(--c-forest); color: var(--c-paper);
  isolation: isolate;
}
.media img.photo { width: 100%; height: 100%; object-fit: cover; }
.media .topo { color: #2a3d2c; }
.media .mk { position: absolute; right: -8%; bottom: -12%; width: 62%; color: var(--c-leaf); opacity: .55; z-index: 1; transition: transform 1.2s var(--ease); }
.media .mk svg { width: 100%; height: auto; }
.media:hover .mk { transform: translate(-2%, -2%) rotate(-3deg); }
.media .cap {
  position: absolute; left: .75rem; top: .75rem; z-index: 3;
  font-family: var(--f-mono); font-size: .7rem; line-height: 1.3;
  background: rgba(14,20,16,.72); color: var(--c-mist); padding: .3rem .5rem; border-radius: 4px; max-width: calc(100% - 1.5rem);
  border: 1px dashed rgba(221,227,210,.35);
}
.media.t-pine { background: var(--c-pine); }
.media.t-pine .mk { color: var(--c-lime-off); opacity: .4; }
.media.t-bone { background: #dfe2d3; color: var(--c-forest); }
.media.t-bone .topo { color: rgba(42,97,48,.14); }
.media.t-bone .mk { color: var(--c-leaf); opacity: .35; }
.media.t-lime { background: #b9de38; }
.media.t-lime .topo { color: rgba(23,37,26,.12); }
.media.t-lime .mk { color: var(--c-forest); opacity: .18; }
.media.t-ink { background: #121a14; }
.monogram { position: absolute; inset: 0; display: grid; place-items: center; z-index: 2; font-family: var(--f-serif); font-style: italic; font-weight: 700; font-size: 2.75rem; color: var(--c-lime-off); letter-spacing: -.02em; }

/* ===================================================================== Revelação por linha (LN4 [data-anim-high]) */
.rv-line { display: block; position: relative; overflow: hidden; }
.rv-line > .rv-in { display: inline-block; position: relative; }
.js .rv:not(.rv-done) .rv-in { clip-path: inset(0 100% 0 0); }
.rv-in::after { content: ""; position: absolute; inset: -.04em -.06em; background: var(--rv-c, var(--c-lime)); transform: scaleX(0); transform-origin: left; pointer-events: none; }
.rv.go .rv-in { animation: rvClip .6s var(--ease-out) forwards; animation-delay: calc(var(--i) * .15s); }
.rv.go .rv-in::after { animation: rvBlock .9s var(--ease) forwards; animation-delay: calc(var(--i) * .15s); }
@keyframes rvClip { to { clip-path: inset(0 0 0 0); } }
@keyframes rvBlock { 0% { transform: scaleX(0); transform-origin: left; } 45% { transform: scaleX(1); transform-origin: left; } 46% { transform-origin: right; } 100% { transform: scaleX(0); transform-origin: right; } }
.js .fade { opacity: 0; transform: translateY(1.5rem); transition: opacity .9s var(--ease-out), transform .9s var(--ease-out); transition-delay: var(--d, 0s); }
.js .fade.in { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  .js .rv .rv-in { clip-path: none !important; }
  .js .fade { opacity: 1; transform: none; }
  .marquee-track { animation: none !important; }
}

/* ===================================================================== HOME — Hero */
.hero { position: relative; padding-top: var(--s4); padding-bottom: var(--s6); overflow: clip; }
@media (min-width: 992px) { .hero { padding-top: var(--s5); padding-bottom: var(--s7); } }
.hero .grid { row-gap: var(--s5); align-items: stretch; }
.hero-copy { grid-column: 1 / -1; display: flex; flex-direction: column; justify-content: space-between; gap: var(--s5); }
.hero-media { grid-column: 1 / -1; position: relative; min-height: 22rem; }
@media (min-width: 992px) {
  .hero-copy { grid-column: 1 / span 7; padding-top: var(--s4); }
  .hero-media { grid-column: 8 / span 5; min-height: 38rem; }
}
.hero h1 .l2 { display: block; }
.hero-sub { display: grid; gap: var(--s4); }
.hero-ctas { display: flex; flex-wrap: wrap; align-items: center; gap: 1.25rem 1.75rem; }
.hero-media .media { position: absolute; inset: 0; }
.hero-card {
  position: absolute; left: 1rem; bottom: 1rem; z-index: 4; width: min(17rem, calc(100% - 2rem));
  color: var(--c-paper); padding: 2.1rem 1.1rem 1.1rem;
}
.hero-card .notch-fill { background: rgba(14,20,16,.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.hero-card .inner { position: relative; z-index: 3; display: grid; gap: .75rem; }
.hero-card .row { display: flex; align-items: center; gap: .75rem; }
.hero-card .row + .row { border-top: 1px solid var(--c-line-dark); padding-top: .75rem; }
.hero-card .mini { width: 2.25rem; height: 2.25rem; color: var(--c-lime); flex: none; }
.hero-card .t { font-size: var(--fs-sm); font-weight: 650; line-height: 1.25; }
.hero-card .tag { position: absolute; top: .55rem; right: 1rem; z-index: 3; color: var(--c-lime); }

/* Métricas / números do setor */
.stats { display: grid; grid-template-columns: 1fr; border-top: 1px solid var(--c-line-dark); }
@media (min-width: 640px) { .stats { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1100px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { padding: var(--s4) var(--s3) var(--s4) 0; border-bottom: 1px solid var(--c-line-dark); display: grid; gap: .75rem; align-content: start; }
@media (min-width: 640px) { .stat { padding-right: var(--s4); } .stat:nth-child(odd) { border-right: 1px solid var(--c-line-dark); } .stat:nth-child(even) { padding-left: var(--s4); } }
@media (min-width: 1100px) { .stat { border-bottom: 0; } .stat + .stat { border-left: 1px solid var(--c-line-dark); padding-left: var(--s4); } .stat:nth-child(odd) { border-right: 0; } }
.stat .num { font-size: clamp(3rem, 14vw, var(--fs-3xl)); color: var(--c-paper); }
.stat .num small { font-size: .45em; font-weight: 700; margin-left: .1em; letter-spacing: 0; }
.stat .num .pre { font-size: .45em; margin-right: .12em; vertical-align: .55em; }
.stat .k { font-size: var(--fs-base); font-weight: 650; color: var(--c-mist); line-height: 1.3; max-width: 22ch; }
.stat .src { font-size: var(--fs-xs); color: var(--c-sage); line-height: 1.4; }
[data-theme="light"] .stats, [data-theme="light"] .stat, [data-theme="bone"] .stats, [data-theme="bone"] .stat { border-color: var(--c-line-light) !important; }
[data-theme="light"] .stat .num, [data-theme="bone"] .stat .num { color: var(--c-forest); }
[data-theme="light"] .stat .k, [data-theme="bone"] .stat .k { color: var(--c-forest); }
[data-theme="light"] .stat .src, [data-theme="bone"] .stat .src { color: var(--c-slate); }

/* Pílula de resultado (LN4 .horizontal-item-pill) */
.pill { display: inline-flex; border: .5px solid var(--c-sage); border-radius: .4rem; overflow: hidden; font-size: var(--fs-xs); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; font-variation-settings: "wdth" 86; line-height: 1; }
.pill > span { padding: .45rem .6rem; display: inline-flex; align-items: center; gap: .35rem; }
.pill > span + span { border-left: .5px solid var(--c-sage); }
.pill .k { background: var(--c-lime); color: var(--c-forest); }
[data-theme="light"] .pill, [data-theme="bone"] .pill, [data-theme="light"] .pill > span + span, [data-theme="bone"] .pill > span + span { border-color: rgba(23,37,26,.35); }

/* Pilares — lista numerada com linhas finas (evita grade de cards idênticos) */
.pillars { border-top: 1px solid var(--c-line-light); }
.pillar { display: grid; grid-template-columns: 3rem 1fr; gap: 1rem; padding-block: var(--s4); border-bottom: 1px solid var(--c-line-light); align-items: start; position: relative; }
.pillar .n { font-family: var(--f-serif); font-style: italic; font-weight: 700; font-size: var(--fs-lg); color: var(--c-pine); line-height: 1; }
.pillar h3 { font-size: var(--fs-lg); font-weight: 760; text-transform: uppercase; font-variation-settings: "wdth" 104; line-height: 1; margin-bottom: .75rem; }
.pillar p { color: var(--c-slate); max-width: 52ch; }
.pillar ul { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
.pillar li { font-size: var(--fs-xs); font-weight: 700; padding: .3rem .6rem; border-radius: 99px; background: rgba(42,97,48,.08); color: var(--c-pine); }
@media (min-width: 768px) {
  .pillar { grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gutter); }
  .pillar .n { grid-column: 1 / span 1; }
  .pillar h3 { grid-column: 2 / span 4; margin: 0; }
  .pillar .d { grid-column: 7 / span 6; }
}

/* Programas — vitrine com molduras entalhadas */
.prog-grid { display: grid; gap: var(--gutter); grid-template-columns: 1fr; }
@media (min-width: 992px) { .prog-grid { grid-template-columns: repeat(12, minmax(0,1fr)); grid-template-rows: auto auto; } .prog-main { grid-column: 1 / span 7; grid-row: 1 / span 2; } .prog-side { grid-column: 8 / span 5; } }
.pcard { display: flex; flex-direction: column; min-height: 100%; color: var(--c-paper); }
.pcard .pc-media { position: relative; aspect-ratio: 16 / 9; margin: .5rem .5rem 0; border-radius: .35rem; overflow: hidden; }
.prog-main .pcard .pc-media { aspect-ratio: 4 / 3; }
.pcard .pc-media .media { position: absolute; inset: 0; }
.pcard .pc-body { padding: var(--s3) var(--s3) var(--s5); display: grid; gap: .9rem; flex: 1; align-content: start; }
.pcard .pc-num { font-size: var(--fs-2xl); color: var(--c-lime); }
.prog-main .pcard .pc-num { font-size: clamp(3rem, 12vw, var(--fs-4xl)); }
.pcard .pc-num-k { font-size: var(--fs-sm); color: var(--c-sage); margin-top: -.25rem; }
.pcard h3 { font-size: var(--fs-lg); font-weight: 760; text-transform: uppercase; font-variation-settings: "wdth" 104; line-height: 1; }
.pcard p { color: var(--c-sage); max-width: 52ch; }
.pcard .pc-foot { position: absolute; right: 1.1rem; bottom: .55rem; z-index: 3; display: flex; gap: 1rem; align-items: center; }
.pcard .pc-actions { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: center; margin-top: .5rem; }
.pcard a.cover { position: absolute; inset: 0; z-index: 2; }

/* Marquee de parceiros (LN4 logo row) */

/* ===================================================================== Rodapé */

.doc .di { width: 2.75rem; height: 2.75rem; border-radius: var(--r-ctl); background: var(--c-forest); color: var(--c-lime); display: grid; place-items: center; font-size: .625rem; font-weight: 800; letter-spacing: .04em; }

/* Filtros, busca, abas */

/* Destaque de conteúdo */
.feat { display: grid; gap: var(--s4) var(--gutter); grid-template-columns: 1fr; margin-bottom: var(--s7); }

.feat .fm { position: relative; aspect-ratio: 16 / 10; border-radius: var(--r-media); overflow: hidden; }

/* Eventos */
.events { border-top: 1px solid var(--c-line-light); }
.ev { display: grid; grid-template-columns: 5rem 1fr; gap: 1rem 1.25rem; padding: var(--s3) 0; border-bottom: 1px solid var(--c-line-light); align-items: center; position: relative; }

.ev .dt { display: grid; justify-items: start; line-height: .9; }
.ev .dt .d { font-size: var(--fs-2xl); }
.ev .dt .m { font-size: var(--fs-xs); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-top: .35rem; color: var(--c-pine); }

  /* ---------- utilitários ---------- */
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MESES = ["jan.", "fev.", "mar.", "abr.", "mai.", "jun.", "jul.", "ago.", "set.", "out.", "nov.", "dez."];
  const MESES_L = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
  const parse = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
  const fmt = (iso, style = "short") => {
    if (!iso) return "";
    const dt = parse(iso);
    if (style === "long") return `${dt.getDate()} de ${MESES_L[dt.getMonth()]} de ${dt.getFullYear()}`;
    if (style === "num") return `${String(dt.getDate()).padStart(2, "0")}/${String(dt.getMonth() + 1).padStart(2, "0")}/${dt.getFullYear()}`;
    return `${dt.getDate()} ${MESES[dt.getMonth()]} ${dt.getFullYear()}`;
  };
  const daysAgo = (iso) => Math.floor((TODAY - parse(iso)) / 864e5);
  const todo = (t = "a confirmar") => `<span class="todo" title="Informação pendente de confirmação pela ASUMAS">${esc(t)}</span>`;
  const waHref = (msg = "Olá! Vim pelo site da ASUMAS.") => S.whatsapp ? `https://wa.me/${S.whatsapp}?text=${encodeURIComponent(msg)}` : "#/contato";

  /* ================================================================= HOME */
  function home() {
    const comunicados = C.filter((c) => c.cat === "comunicados" && daysAgo(c.date) <= 60).sort(byDate).slice(0, 3);
    const upcoming = E.filter((e) => parse(e.end || e.start) >= new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate())).sort((a, b) => (a.start > b.start ? 1 : -1)).slice(0, 3);
    const stories = C.filter((c) => c.cat === "historias");
    const feat = stories[0], others = stories.slice(1, 4);
    const latest = C.filter((c) => c.cat === "noticias" || c.cat === "mercado").sort(byDate).slice(0, 3);
    const censo = C.find((c) => c.slug === "censo-da-suinocultura-ms-2026");
    const ed = C.find((c) => c.cat === "comunicados");

    return `
    <section class="hero" data-theme="light" aria-labelledby="h-hero">
      ${topo()}
      <div class="c" style="position:relative;z-index:1"><div class="grid">
        <div class="hero-copy">
          <div>
            ${eyebrow("Desde 1993 · Suinocultura de Mato Grosso do Sul")}
            <h1 id="h-hero" class="impact mt4" data-rv tabindex="-1">A força de<br><span class="serif acc">quem produz</span><br>suínos em MS</h1>
          </div>
          <div class="hero-sub">
            <p class="lead">Representamos o suinocultor junto ao governo e à indústria, conduzimos programas que remuneram boas práticas e transformamos dados do setor em decisão.</p>
            <div class="hero-ctas">${btn("Quero me associar", "#/associe-se", { size: "lg" })}${tlink("Conheça nossos programas", "#/programas")}</div>
          </div>
        </div>
        <div class="hero-media">
          <div data-notch="t,0.36,34,22" data-clip-self style="position:absolute;inset:0;border-radius:22px;overflow:hidden">${media({ tone: "", cap: "Inserir foto real: produtor na granja", label: "Produtor de suínos em granja de Mato Grosso do Sul" })}</div>
          ${notch("t,0.62,22,8", `<span class="tag" style="background:transparent;padding:0;color:var(--c-lime)">Novidades</span>
            <div class="inner">
              <a class="row" href="#/programas/censo"><span class="mini">${I.chart}</span><span class="t">Censo da Suinocultura MS 2026: relatório disponível</span></a>
              ${ed ? `<a class="row" href="#/conteudos/${ed.slug}"><span class="mini">${I.doc}</span><span class="t">${esc(ed.kind)}: Assembleia Geral Extraordinária</span></a>` : ""}
            </div>`, { cls: "hero-card", fill: true })}
        </div>
      </div></div>
    </section>

    <section class="sec" data-theme="dark" aria-labelledby="h-num">
      ${topo()}
      <div class="c">
        ${eyebrow("Números do setor", true, "lg")}
        <h2 id="h-num" class="sr-only">Números do setor</h2>
        <p class="statement mt4" data-rv>Mato Grosso do Sul é o <strong>5º estado</strong> em abate de suínos — e a atividade cresceu <span class="serif acc">cerca de 50%</span> em três anos.</p>
        <div class="stats mt6">${window.STATS.map((s) => `
          <div class="stat fade"><div class="num">${s.pre ? `<span class="pre">${s.pre}</span>` : ""}<span data-count="${s.v}" data-dec="${s.dec}">${s.v.toLocaleString("pt-BR", { minimumFractionDigits: s.dec })}</span>${s.suf ? `<small>${s.suf}</small>` : ""}</div>

          <div class="pillar fade"><span class="n">0${i + 1}</span><h3>${p.t}</h3><div class="d"><p class="body">${p.d}</p><ul>${p.tags.map((t) => `<li>${t}</li>`).join("")}</ul></div></div>`).join("")}

  function progCard(p, main) {

      <a class="cover" href="${href}" aria-label="${esc(p.name)}"></a>
      <div class="pc-media">${media({ tone: p.tone, cap: main ? "Foto real: granja participante (inserir)" : null })}</div>
      <div class="pc-body">
        <span class="eyebrow">${esc(p.short)}</span>
        <h3>${esc(p.name)}</h3>
        <div><div class="num pc-num">${esc(p.num)}</div><div class="pc-num-k">${esc(p.numK)}</div></div>
        <p class="body-sm">${esc(p.desc)}</p>
        ${main ? `<div class="pc-actions">${btn("Acessar o PLVC", plvcHref, { icon: S.plvc ? "ne" : "e" })}${tlink("Entenda o programa", href)}</div>` : ""}

  function evDateBlock(e) {
    const d = parse(e.start);
    return `<div class="dt"><span class="d num">${String(d.getDate()).padStart(2, "0")}</span><span class="m">${["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"][d.getMonth()]}</span><span class="y">${d.getFullYear()}</span></div>`;
  }
  function isPast(e) { return parse(e.end || e.start) < new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate()); }
  function evRow(e) {
    const past = isPast(e);
    return `<div class="ev fade">${evDateBlock(e)}
      <div><h3><a href="#/eventos/${e.slug}">${esc(e.name)}</a></h3></div>
      <div class="k"><b>Cidade</b>${esc(e.city)}</div>
      <div class="k"><b>Organizador</b>${esc(e.org)}</div>
      <div class="act">${past ? `<span class="pill"><span>Realizado</span></span>` : e.signup ? btn("Inscrever-se", e.signup, { kind: "primary" }) : `<span class="pill"><span>Inscrições em breve</span></span>`}</div>
    </div>`;
  }
  function emptyEvents() {
    return `<div class="empty fade"><span class="ic">${I.calX}</span><p class="t">Nenhum evento agendado</p><p class="body muted">Os próximos encontros da ASUMAS aparecem aqui assim que forem confirmados. Enquanto isso, veja como foram os eventos anteriores.</p>${tlink("Ver eventos realizados", "#/eventos?tab=realizados")}</div>`;

  function renderConteudos(root, q) {
    const PER = 12;
    const out = root.querySelector("#c-results");
    const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const draw = () => {
      const term = norm(q.q || "");
      let list = C.slice().sort(byDate).filter((c) => (!q.cat || c.cat === q.cat) && (!term || norm(c.title + " " + (c.excerpt || "") + " " + (c.person || "")).includes(term)));
      const showFeat = !q.cat && !term && (q.p || 1) == 1;
      const feat = showFeat ? list.find((c) => c.featured) : null;
      if (feat) list = list.filter((c) => c !== feat);
      const pages = Math.max(1, Math.ceil(list.length / PER)); const p = Math.min(+(q.p || 1), pages);
      const slice = list.slice((p - 1) * PER, p * PER);
      out.innerHTML = `
        ${feat ? `<a class="feat" href="#/conteudos/${feat.slug}"><div class="fm">${media({ tone: feat.tone })}</div><div class="ft">${eyebrow("Em destaque")}<div class="meta mt3 row" style="gap:.75rem">${catTag(feat.cat)}<span class="date-s">${fmt(feat.date)}</span></div><h2>${esc(feat.title)}</h2><p class="body muted">${esc(feat.excerpt)}</p><span class="tlink mt3">${"Ler matéria"}</span></div></a>` : ""}
        ${slice.length ? `<p class="note mb4">${list.length + (feat ? 1 : 0)} ${list.length + (feat ? 1 : 0) === 1 ? "conteúdo" : "conteúdos"}${q.cat ? ` em ${window.CATS[q.cat].label}` : ""}${term ? ` para “${esc(q.q)}”` : ""}</p><div class="cgrid">${slice.map(ccard).join("")}</div>` :
          `<div class="empty"><span class="ic">${I.search}</span><p class="t">Nada encontrado</p><p class="body muted">Tente outro termo ou veja todas as categorias.</p><button class="tlink" data-clear>Limpar filtros</button></div>`}

    const sync = () => { const s = new URLSearchParams(); if (q.cat) s.set("cat", q.cat); if (q.q) s.set("q", q.q); if (q.p > 1) s.set("p", q.p); history.replaceState(null, "", "#/conteudos" + (s.toString() ? "?" + s : "")); };

  function ics(e) {
    const d = (iso) => iso.replace(/-/g, "");
    const end = parse(e.end || e.start); end.setDate(end.getDate() + 1);
    const endS = `${end.getFullYear()}${String(end.getMonth() + 1).padStart(2, "0")}${String(end.getDate()).padStart(2, "0")}`;
    const body = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//ASUMAS//Eventos//PT-BR", "BEGIN:VEVENT", `UID:${e.slug}@asumas.com.br`, `DTSTART;VALUE=DATE:${d(e.start)}`, `DTEND;VALUE=DATE:${endS}`, `SUMMARY:${e.name}`, `LOCATION:${e.venue} - ${e.city}`, `DESCRIPTION:${e.desc}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([body], { type: "text/calendar" })); a.download = `${e.slug}.ics`; a.click();
  }

    <section class="sec" data-theme="bone" aria-labelledby="h-end"><div class="c"><div class="split">
      <div class="a">${eyebrow("Endereço")}<h2 id="h-end" class="title-m mt3">Sede no <span class="serif acc">Sistema Famasul</span></h2><address class="lead mt3" style="font-style:normal">${S.address}<br>${S.city}<br>CEP ${S.cep}</address>${tlink("Abrir no Google Maps", `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(S.mapsQuery)}`, { cls: "mt4" })}</div>
      <div class="b"><div class="mapbox"><iframe title="Mapa da sede da ASUMAS" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${encodeURIComponent(S.mapsQuery)}&output=embed"></iframe></div></div>
    </div></div></section>
    ${ctaJoin()}`;
  }

  /* ================================================================= SISTEMA */
  function privacidade() {
    return `
    ${pageHead({ crumbs: [["Política de privacidade"]], title: `Política de<br><span class="serif acc">privacidade</span>`, intro: "Como a ASUMAS coleta, usa e protege seus dados pessoais, de acordo com a Lei Geral de Proteção de Dados (Lei nº 13.709/2018)." })}
    <section class="sec" data-theme="light" style="padding-top:0"><div class="c"><div class="art-body" style="padding-top:0">
      <aside class="share"><span class="eyebrow">Última atualização</span><span class="label">${todo("data de vigência")}</span></aside>
      <div class="prose">
        <p class="note">${todo("revisão jurídica recomendada antes da publicação")}</p>
        <h2>1. Quem é o controlador</h2><p>A Associação Sul-Mato-Grossense de Suinocultores (ASUMAS), com sede na ${S.address}, ${S.city}, CEP ${S.cep}, é a controladora dos dados pessoais tratados neste site.</p>
        <h2>2. Quais dados coletamos</h2><ul><li><strong>Ficha de filiação:</strong> nome, WhatsApp, e-mail, município, atividade, número de matrizes ou animais e mensagem.</li><li><strong>Formulário de contato:</strong> nome, e-mail, telefone (opcional), assunto e mensagem.</li><li><strong>Navegação:</strong> dados técnicos de acesso, como endereço IP, navegador e páginas visitadas, quando houver ferramentas de medição ativas.</li></ul>
        <h2>3. Para que usamos</h2><ul><li>Responder à sua solicitação e conduzir o processo de filiação.</li><li>Enviar comunicados oficiais e convocações aos associados.</li><li>Cumprir obrigações legais e estatutárias.</li></ul>
        <h2>4. Base legal</h2><p>Tratamos os dados com base no seu consentimento, na execução de procedimentos preliminares à filiação e no cumprimento de obrigações legais e estatutárias.</p>
        <h2>5. Compartilhamento</h2><p>A ASUMAS não vende dados pessoais. O compartilhamento ocorre apenas quando necessário para a operação do site e dos formulários, ou por obrigação legal.</p>
        <h2>6. Seus direitos</h2><p>Você pode solicitar confirmação, acesso, correção, anonimização, portabilidade ou eliminação dos seus dados, e revogar o consentimento a qualquer momento.</p>
        <h2>7. Como falar com a ASUMAS</h2><p>Envie sua solicitação para <a href="mailto:${S.ouvidoria}">${S.ouvidoria}</a> ou <a href="mailto:${S.email}">${S.email}</a>. Responderemos nos prazos previstos na LGPD.</p>
        <h2>8. Segurança e retenção</h2><p>Mantemos os dados pelo tempo necessário às finalidades acima e adotamos medidas técnicas e administrativas para protegê-los.</p>
      </div>
    </div></div></section>`;
  }
  function notFound() {
    return `
    <section class="sec nf" data-theme="dark">${topo()}<div class="c">
      <div class="big404 num" aria-hidden="true">404</div>
      <h1 class="title-l mt4" tabindex="-1">Esta página <span class="serif acc">saiu do mapa</span></h1>
      <p class="lead mt3" style="color:var(--c-mist)">O endereço pode ter mudado ou o conteúdo foi removido. Busque o que procura ou volte ao início.</p>
      <form class="row mt5" data-search404 role="search" style="max-width:40rem"><label class="search" style="max-width:none"><span class="sr-only">Buscar no site</span>${I.search}<input type="search" name="q" placeholder="Buscar conteúdos" style="background:var(--c-paper)"></label>${btn("Buscar", "", { button: true, type: "submit", icon: "search" })}</form>
      <div class="row mt5">${tlink("Ir para a página inicial", "#/", { cls: "lime" })}${tlink("Ver conteúdos", "#/conteudos")}</div>
    </div></section>`;
  }

  /* ================================================================= FORMULÁRIOS */
  function initForms(root) {
    root.querySelectorAll('[data-mask="phone"]').forEach((i) => i.addEventListener("input", () => {
      let d = i.value.replace(/\D/g, "").slice(0, 11);
      i.value = d.length > 10 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : d.length > 6 ? `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}` : d.length > 2 ? `(${d.slice(0, 2)}) ${d.slice(2)}` : d;
    }));
    root.querySelectorAll("form[data-form]").forEach((f) => {
      const check = (el) => {
        const fld = el.closest(".field"); if (!fld) return true;
        let ok = el.checkValidity();
        if (ok && el.dataset.mask === "phone" && el.value) ok = el.value.replace(/\D/g, "").length >= 10;
        if (el.type === "radio") ok = !!f.querySelector(`input[name="${el.name}"]:checked`);
        fld.classList.toggle("invalid", !ok); el.setAttribute("aria-invalid", !ok);
        const err = fld.querySelector(".err"); if (err) { err.id = err.id || el.id + "-err" || ""; if (el.id) el.setAttribute("aria-describedby", err.id); }
        return ok;
      };
      f.querySelectorAll("input,select,textarea").forEach((el) => {
        el.addEventListener("blur", () => { if (el.value || el.type === "checkbox") check(el); });
        el.addEventListener("input", () => { if (el.closest(".field")?.classList.contains("invalid")) check(el); });
        el.addEventListener("change", () => check(el));
      });
      f.addEventListener("submit", (e) => {
        e.preventDefault();
        const st = f.querySelector(".form-status"); st.className = "form-status";
        const els = Array.from(f.querySelectorAll("input,select,textarea")).filter((x) => x.required || x.value);
        const bad = els.filter((x) => !check(x));
        if (bad.length) { st.className = "form-status bad"; st.textContent = `Revise ${bad.length === 1 ? "1 campo destacado" : bad.length + " campos destacados"} antes de enviar.`; bad[0].focus(); return; }
        const b = f.querySelector('button[type="submit"]'); b.classList.add("is-loading"); b.setAttribute("aria-busy", "true"); b.disabled = true;
        f.querySelectorAll("input,select,textarea").forEach((x) => (x.disabled = true));
        setTimeout(() => {
          b.classList.remove("is-loading"); b.removeAttribute("aria-busy"); b.disabled = false;
          f.querySelectorAll("input,select,textarea").forEach((x) => (x.disabled = false)); f.reset();
          st.className = "form-status ok";
          st.innerHTML = `${I.check}<span>${f.dataset.form === "filiacao" ? "Ficha recebida! A equipe da ASUMAS vai falar com você pelo WhatsApp informado para os próximos passos." : "Mensagem enviada! Responderemos no e-mail informado."}</span>`;
          st.focus && st.setAttribute("tabindex", "-1"); st.focus();
        }, 1400);
      });
    });
    const s404 = root.querySelector("[data-search404]");
    if (s404) s404.addEventListener("submit", (e) => { e.preventDefault(); const v = s404.q.value.trim(); location.hash = "#/conteudos" + (v ? "?q=" + encodeURIComponent(v) : ""); });
  }

  /* ================================================================= ROTEADOR */
  const TITLES = { "": "Associação Sul-Mato-Grossense de Suinocultores", institucional: "Institucional", programas: "Programas", "associe-se": "Associe-se", conteudos: "Conteúdos", eventos: "Eventos", documentos: "Documentos", parceiros: "Parceiros", "links-uteis": "Links úteis", contato: "Contato", "politica-de-privacidade": "Política de privacidade" };
  function route() {
    const raw = location.hash.replace(/^#\/?/, "");
    const [path, qs] = raw.split("?");
    const q = Object.fromEntries(new URLSearchParams(qs || ""));
    const seg = path.split("/").filter(Boolean);
    let html = null, title = TITLES[seg[0] || ""], after = null;
    switch (seg[0] || "") {
      case "": html = home(); break;
      case "institucional": html = institucional(); break;
      case "programas":
        if (!seg[1]) html = programas();
        else if (seg[1] === "leitao-vida") { html = leitaoVida(); title = "Leitão Vida"; }
        else if (seg[1] === "pas") { html = pas(); title = "Programa ASUMAS de Sustentabilidade"; after = renderPAS; }
        else if (seg[1] === "censo") { html = censo(); title = "Censo da Suinocultura MS"; }
        break;
      case "associe-se": html = associe(); break;
      case "conteudos":
        if (!seg[1]) { html = conteudos(q); after = (r) => renderConteudos(r, q); }
        else { html = materia(seg[1]); const c = C.find((x) => x.slug === seg[1]); title = c && c.title; }
        break;
      case "eventos":
        if (!seg[1]) { html = eventos(q); after = initTabs; }
        else { html = evento(seg[1]); const e = E.find((x) => x.slug === seg[1]); title = e && e.name; }
        break;
      case "documentos": html = documentos(); after = renderDocs; break;
      case "parceiros": html = parceiros(); break;
      case "links-uteis": html = links(); break;
      case "contato": html = contato(q); break;
      case "politica-de-privacidade": html = privacidade(); break;
    }
    if (!html) { html = notFound(); title = "Página não encontrada"; }
    const main = document.getElementById("main");
    main.innerHTML = html;
    document.title = `${title} | ASUMAS`;
    // menu ativo
    document.querySelectorAll("[data-nav]").forEach((a) => { const on = seg[0] && a.dataset.nav === "#/" + seg[0]; on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"); });
    closeDrawer();
    initBehaviors(main); initForms(main); animateDonuts(main);
    main.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", () => { navigator.clipboard && navigator.clipboard.writeText(location.href); toast("Link copiado"); }));
    main.querySelectorAll("[data-ics]").forEach((b) => b.addEventListener("click", () => ics(E.find((x) => x.slug === b.dataset.ics))));
    if (after) after(main);
    // rolagem: seção solicitada (?s=) ou topo
    const target = q.s && document.getElementById(q.s);
    if (target) setTimeout(() => target.scrollIntoView({ block: "start" }), 50); else window.scrollTo(0, 0);
    // foco acessível no título após navegação (não no primeiro carregamento)
    if (route.loaded) { const h = main.querySelector("h1"); h && h.focus({ preventScroll: true }); }
    route.loaded = true;
    setTimeout(navTheme, 60);
  }
  function initTabs(root) {
    const tabs = Array.from(root.querySelectorAll('[role="tab"]'));
    const sel = (t) => { tabs.forEach((x) => { const on = x === t; x.setAttribute("aria-selected", on); x.tabIndex = on ? 0 : -1; document.getElementById(x.getAttribute("aria-controls")).hidden = !on; }); history.replaceState(null, "", "#/eventos" + (t.dataset.tab === "realizados" ? "?tab=realizados" : "")); initBehaviors(root); root.querySelectorAll(".fade").forEach((f) => f.classList.add("in")); };
    tabs.forEach((t, i) => { t.addEventListener("click", () => sel(t)); t.addEventListener("keydown", (e) => { if (e.key === "ArrowRight" || e.key === "ArrowLeft") { const n = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length]; n.focus(); sel(n); } }); });
    root.querySelectorAll("[data-tab-go]").forEach((b) => b.addEventListener("click", () => { const t = tabs.find((x) => x.dataset.tab === b.dataset.tabGo); t.focus(); sel(t); }));
  }
  function renderPAS(root) {
    const body = root.querySelector("#pas-body"), inp = root.querySelector("#pas-q"), ct = root.querySelector("#pas-count");
    let key = "granja", dir = 1;
    const draw = () => {
      const t = inp.value.trim().toLowerCase();
      const rows = window.PAS_GRANJAS.filter((g) => !t || (g.granja + " " + g.municipio).toLowerCase().includes(t)).sort((a, b) => (a[key] > b[key] ? dir : -dir));
      ct.textContent = `${rows.length} ${rows.length === 1 ? "granja" : "granjas"}`;
      body.innerHTML = rows.length ? rows.map((g) => `<tr><td><b>${esc(g.granja)}</b></td><td>${esc(g.municipio)}</td><td>${esc(g.atividade)}</td><td>${g.ano}</td></tr>`).join("") :
        `<tr class="empty-row"><td colspan="4">${window.PAS_GRANJAS.length ? "Nenhuma granja encontrada para essa busca." : `A lista oficial de granjas reconhecidas pelo PAS ainda não foi publicada. ${todo("importar lista da ASUMAS")}`}</td></tr>`;
    };
    inp.addEventListener("input", draw);
    root.querySelectorAll("[data-sort]").forEach((b) => b.addEventListener("click", () => { if (key === b.dataset.sort) dir *= -1; else { key = b.dataset.sort; dir = 1; } draw(); }));
    draw();
  }

  /* ================================================================= NAV / DRAWER */
  let nav, drawer, ham;
  function closeDrawer() { if (!drawer) return; drawer.classList.remove("open"); drawer.setAttribute("aria-hidden", "true"); ham.setAttribute("aria-expanded", "false"); ham.setAttribute("aria-label", "Abrir menu"); nav.classList.remove("menu-open"); document.body.style.overflow = ""; }
  function navTheme() {
    if (!nav || nav.classList.contains("menu-open")) return;
    const y = nav.getBoundingClientRect().bottom + 2;
    let theme = "light";
    for (const el of document.elementsFromPoint(Math.min(40, innerWidth / 2), y)) {
      if (el.closest && el.closest("#nav,.drawer,.util")) continue;
      const s = el.closest && el.closest("[data-theme]"); if (s) { theme = s.dataset.theme; break; }
    }
    nav.classList.toggle("is-dark", theme === "dark" || theme === "deep");
    nav.classList.toggle("is-scrolled", scrollY > 10);
  }
  function boot() {
    document.documentElement.classList.add("js");
    document.body.innerHTML = shell();
    nav = document.getElementById("nav"); drawer = document.getElementById("drawer"); ham = nav.querySelector(".ham");
    initBehaviors(document.body);
    ham.addEventListener("click", () => {
      const open = !drawer.classList.contains("open");
      if (!open) return closeDrawer();
      drawer.classList.add("open"); drawer.setAttribute("aria-hidden", "false"); ham.setAttribute("aria-expanded", "true"); ham.setAttribute("aria-label", "Fechar menu"); nav.classList.add("menu-open"); nav.classList.remove("is-dark"); document.body.style.overflow = "hidden";
      drawer.querySelector("nav a").focus();
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && drawer.classList.contains("open")) { closeDrawer(); ham.focus(); navTheme(); } });
    addEventListener("scroll", () => requestAnimationFrame(navTheme), { passive: true });
    addEventListener("resize", navTheme);
    addEventListener("hashchange", route);
    route();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
</body>
</html>
